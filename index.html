function WaitingRoom({ gameId, userId, playerName, playerAvatar, mySeat, onStartGame, onLeaveGame }) {  // Updated signature
  const [game, setGame] = useState(null);
  const [isCreator, setIsCreator] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [myReady, setMyReady] = useState(false); // PHASE 2.1: Track my ready state

  useEffect(() => {
    const gameRef = database.ref(`lobby/games/${gameId}`);
    
    // Listen to game updates
    const listener = gameRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        setGame(data);
        setIsCreator(data.creatorId === userId);
        console.log('Game updated:', data);
        
        // PHASE 2.1: Update my ready state from server
        const players = data.players || {};
        if (players[mySeat]) {
          setMyReady(players[mySeat].ready || false);
        }
        
        // Check if game started
        if (data.status === 'playing') {
          onStartGame();
        }
      } else {
        // Game was deleted
        setError('Game no longer exists');
        setTimeout(() => onLeaveGame(), 2000);
      }
    }, (err) => {
      console.error('Error listening to game:', err);
      setError('Connection error');
    });

    // Set up presence/heartbeat
    const presenceRef = database.ref(`lobby/games/${gameId}/players/${mySeat}`);
    const gameExistsRef = database.ref(`lobby/games/${gameId}/createdAt`);
    const heartbeat = setInterval(async () => {
      // Only send heartbeat if game still exists (has createdAt)
      const snapshot = await gameExistsRef.once('value');
      if (snapshot.exists()) {
        presenceRef.update({ 
          lastSeen: Date.now(), 
          connected: true 
        }).catch(err => console.error('Heartbeat error:', err));
      } else {
        console.log('Game no longer exists, stopping heartbeat');
        clearInterval(heartbeat);
      }
    }, 5000);

    // Handle disconnect
    presenceRef.onDisconnect().update({ connected: false, ready: false });

    return () => {
      gameRef.off('value', listener);
      clearInterval(heartbeat);
    };
  }, [gameId, userId, mySeat]);  // Changed playerId to userId
  // PHASE 2.1: Toggle ready state
  const handleToggleReady = async () => {
    const newReady = !myReady;
    setMyReady(newReady);

        ready: newReady
      });
      console.log('Ready state updated:', newReady);

      setError('Failed to update ready state');

    setLoading(true);

      setPlayerName(savedPlayerName);

      setAppState('lobby');
    }
  }, []);

  const handleLogin = (uid, uname, avatar) => {  // Updated signature
    debug.auth('User logged into app:', uname, uid);
    console.log('Logged in:', uname, uid);
    setUserId(uid);
    setPlayerName(uname);
    setPlayerAvatar(avatar);
    
    // Save to localStorage for persistence
    localStorage.setItem('userId', uid);
    localStorage.setItem('playerName', uname);
    localStorage.setItem('playerAvatar', avatar);
    
    setAppState('lobby');
  };

  const handleJoinGame = (gid, seat) => {
    debug.game('Joining game:', gid, 'seat:', seat);
    console.log('Joining game:', gid, 'as', seat);
    setGameId(gid);
    setMySeat(seat);
    setAppState('waiting');
  };

  const handleStartGame = () => {
    debug.game('Game starting...');
    console.log('Game starting...');
    setAppState('playing');
  };

  const handleLeaveGame = () => {
    debug.game('Left game, returning to lobby');
    console.log('Left game, returning to lobby');
    setGameId(null);
    setMySeat(null);
    setAppState('lobby');
  };

  const handleRematch = (newGameId) => {
    console.log('REMATCH: Transitioning to new game:', newGameId);
    setGameId(newGameId);
    // Stay in 'playing' state, just change the game ID
  };

  if (appState === 'login') {
    return <LoginScreen onLogin={handleLogin} />;
  }

  if (appState === 'lobby') {
    return (
      <>
        <LobbyScreen 
          userId={userId}  // Changed from playerId
          playerName={playerName}
          playerAvatar={playerAvatar}  // NEW
          onJoinGame={handleJoinGame}
        />
        <WhatsNewModal isOpen={showWhatsNew} onClose={handleCloseWhatsNew} />
      </>

  }

  if (appState === 'waiting') {
    return (
      <WaitingRoom
        gameId={gameId}
        userId={userId}  // Changed from playerId
        playerName={playerName}
        playerAvatar={playerAvatar}  // NEW
        mySeat={mySeat}

// Convert absolute seat index to relative (for view rotation)
function absoluteToRelative(absolutePos, mySeatIndex) {
  // Player at mySeatIndex should always be shown at position 1 (SOUTH/bottom)
  return (absolutePos - mySeatIndex + 1 + 4) % 4;
}

// Convert relative position to absolute (for game logic)
function relativeToAbsolute(relativePos, mySeatIndex) {
  return (relativePos + mySeatIndex - 1 + 4) % 4;
}

// ============================================================================
// GAME WRAPPER WITH FIREBASE SYNC
// ============================================================================

function GameWrapper({ gameId, userId, playerName, playerAvatar, mySeat, onLeaveGame, onRematch }) {  // Added onRematch → userId, added playerAvatar
  const [gameState, setGameState] = useState(null);
  const [players, setPlayers] = useState({});
  const [disconnectTimer, setDisconnectTimer] = useState(null);
  const gameStateRef = useRef(null);
  const mySeatIndex = SEAT_TO_INDEX[mySeat];

  // Listen to game state from Firebase
  useEffect(() => {
    const gameRef = database.ref(`lobby/games/${gameId}/gameState`);
    const playersRef = database.ref(`lobby/games/${gameId}/players`);
    
    const gameListener = gameRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        console.log('Game state updated from Firebase:', data);
        gameStateRef.current = data;
        setGameState(data);
      }
    });

    const playersListener = playersRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        setPlayers(data);
      }
    });

    // Heartbeat - update every 10 seconds (only if game still exists)
    const heartbeat = setInterval(async () => {
      const gameSnapshot = await database.ref(`lobby/games/${gameId}/createdAt`).once('value');
      if (gameSnapshot.exists()) {
        database.ref(`lobby/games/${gameId}/players/${mySeat}`).update({
          lastSeen: Date.now(),
          disconnected: false
        });
      } else {
        console.log('Game no longer exists, stopping heartbeat');
        clearInterval(heartbeat);
      }
    }, 10000); // 10 second interval
    
    // Disconnect detection - check every 5 seconds (only if game exists)
    const disconnectCheck = setInterval(async () => {
      const gameSnapshot = await database.ref(`lobby/games/${gameId}/createdAt`).once('value');
      if (!gameSnapshot.exists()) {
        console.log('Game no longer exists, stopping disconnect check');
        clearInterval(disconnectCheck);
        return;
      }
      const now = Date.now();
      database.ref(`lobby/games/${gameId}/players`).once('value', (snapshot) => {
        const playerData = snapshot.val();
        if (playerData) {
          Object.entries(playerData).forEach(([seat, player]) => {
            if (!player.isAI && player.lastSeen) {
              const timeSinceLastSeen = now - player.lastSeen;
              if (timeSinceLastSeen > 30000 && !player.disconnected) {
                // Mark as disconnected after 30 seconds
                console.log(`⚠️ Player ${seat} (${player.username}) disconnected - ${Math.floor(timeSinceLastSeen/1000)}s since last seen`);
                database.ref(`lobby/games/${gameId}/players/${seat}`).update({
                  disconnected: true
                });
              } else if (timeSinceLastSeen <= 30000 && player.disconnected) {
                // Reconnected
                console.log(`✅ Player ${seat} (${player.username}) reconnected`);
                database.ref(`lobby/games/${gameId}/players/${seat}`).update({
                  disconnected: false
                });
              }
            }
          });
        }
      });
    }, 5000); // Check every 5 seconds

    return () => {
      gameRef.off('value', gameListener);
      playersRef.off('value', playersListener);
      clearInterval(heartbeat);
      clearInterval(disconnectCheck);
    };
  }, [gameId, mySeat]);

  // Listen for nextGameId (rematch signal)
  useEffect(() => {
    const nextGameRef = database.ref(`lobby/games/${gameId}/nextGameId`);

    const handleNextGame = (snapshot) => {
      const nextGameId = snapshot.val();
      if (nextGameId && onRematch) {
        console.log('REMATCH detected! Transitioning to:', nextGameId);
        onRematch(nextGameId);
      }
    };

    nextGameRef.on('value', handleNextGame);
    return () => nextGameRef.off('value', handleNextGame);
  }, [gameId, onRematch]);

  // Initialize game if needed
  useEffect(() => {
    debug.game('GameWrapper: Checking initialization. gameState:', gameState ? 'EXISTS' : 'NULL');
    if (!gameState) {
      // We're in GameWrapper, so game should be playing. Initialize if needed.
      database.ref(`lobby/games/${gameId}/gameState`).once('value', (snapshot) => {
        const existingState = snapshot.val();
        debug.game('GameWrapper: Checking Firebase gameState:', existingState ? 'EXISTS' : 'NULL');
        
        if (!existingState) {
          console.log('Initializing game state (no existing state found)');
          debug.game('GameWrapper: Initializing game state NOW');
          const initialState = {
            phase: 'start',
            dealer: 0,
            currentPlayer: 0,
            scores: [0, 0],
            initialized: true
          };
          database.ref(`lobby/games/${gameId}/gameState`).set(initialState)
            .then(() => debug.game('GameWrapper: Game state initialized successfully'))
            .catch(err => debug.error('GameWrapper: Failed to initialize game state:', err));
        } else {
          debug.game('GameWrapper: Game state already exists in Firebase, waiting for sync...');
        }
      });
    }
  }, [gameId, userId, gameState]);  // Changed playerId to userId

  if (!gameState || !gameState.initialized) {
    return (
      <div style={{
        height: '100vh',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        background: 'linear-gradient(135deg, #1a5f3f 0%, #2d8f5f 100%)',
        color: 'white'
      }}>
        <div>
          <h2>Initializing game...</h2>
          <p style={{ marginTop: '12px' }}>Game ID: {gameId}</p>
        </div>
      </div>
    );
  }

  return (
    <MultiplayerGameTable
      gameId={gameId}
      userId={userId}
      playerName={playerName}
      mySeat={mySeat}
      mySeatIndex={mySeatIndex}
      gameState={gameState}
      players={players}
      onLeaveGame={onLeaveGame}
      onRematch={onRematch}
    />
  );
}

function MultiplayerGameTable({ gameId, userId, playerName, mySeat, mySeatIndex, gameState, players, onLeaveGame, onRematch }) {
  // All the game state from the original App component
  const [phase, setPhase] = useState('start');
  const [hands, setHands] = useState([[], [], [], []]);
  const [kitty, setKitty] = useState([]);
  const [deck, setDeck] = useState([]);
  const [dealer, setDealer] = useState(0);
  const [currentPlayer, setCurrentPlayer] = useState(0);
  const [bids, setBids] = useState([null, null, null, null]);
  const [highBid, setHighBid] = useState(0);
  const [bidWinner, setBidWinner] = useState(null);
  const [trumpSuit, setTrumpSuit] = useState(null);
  const [trick, setTrick] = useState([]);
  const [trickCards, setTrickCards] = useState([]);
  const [trickLeader, setTrickLeader] = useState(null);
  const [tricksWon, setTricksWon] = useState([0, 0]);
  const [playerTricks, setPlayerTricks] = useState([0, 0, 0, 0]);
  const [roundPts, setRoundPts] = useState([0, 0]);
  const [scores, setScores] = useState([0, 0]);
  const [trickNum, setTrickNum] = useState(0);
  const [selected, setSelected] = useState([]);
  const [trickComplete, setTrickComplete] = useState(false);
  const [resettingRound, setResettingRound] = useState(false);
  const lastTrickNum = useRef(0);
  const [msg, setMsg] = useState('');
  const [lastTrick, setLastTrick] = useState(null);
  const [aiTrump, setAiTrump] = useState(null);
  const [highTrumpInfo, setHighTrumpInfo] = useState({ rank: -1, player: -1 });
  const [history, setHistory] = useState([]);
  const [drawn, setDrawn] = useState([0, 0, 0, 0]);
  const [drawnCards, setDrawnCards] = useState(new Set());
  const [animating, setAnimating] = useState(null);
  const [wasBagged, setWasBagged] = useState(false);
  const [helpOpen, setHelpOpen] = useState(false);
  const [knownOutOfTrump, setKnownOutOfTrump] = useState([false, false, false, false]);
  const [bidderLostTrick, setBidderLostTrick] = useState(false);
  const [postDrawHands, setPostDrawHands] = useState(null);
  const [showHandsOpen, setShowHandsOpen] = useState(false);
  const [roundDealer, setRoundDealer] = useState(0);
  const [roundDrawn, setRoundDrawn] = useState([0, 0, 0, 0]);
  const [cardsPlayed, setCardsPlayed] = useState([]);
  const [playHistory, setPlayHistory] = useState([]);
  const [roundBids, setRoundBids] = useState([null, null, null, null]);
  const timer = useRef(null);
  const dealtHands = useRef(null);
  const statsUpdated = useRef(false); // Track if stats were updated for this game

  // Reset statsUpdated when gameId changes (for rematch/new game)
  useEffect(() => {
    statsUpdated.current = false;
    console.log('Game ID changed - reset statsUpdated flag');
  }, [gameId]);

  // Update player stats when game ends
  useEffect(() => {
    if (phase === 'game-over' && gameState?.winner !== undefined && !statsUpdated.current) {
      statsUpdated.current = true;
      const winningTeam = gameState.winner;
      
      console.log('Updating player stats - Winner: Team', winningTeam);
      
      // Update stats for all human players
      Object.entries(players).forEach(([seat, player]) => {
        if (player && !player.isAI && player.userId) {
          const seatIndex = SEAT_TO_INDEX[seat];
          const playerTeam = seatIndex % 2; // 0,2 = team 0; 1,3 = team 1
          const isWinner = playerTeam === winningTeam;
          
          console.log(`Updating stats for ${player.username} - ${isWinner ? 'WON' : 'LOST'}`);
          
          // Update stats in Firebase
          const statsRef = database.ref(`users/${player.userId}/stats`);
          statsRef.transaction((currentStats) => {
            const stats = currentStats || {
              gamesPlayed: 0,
              gamesWon: 0,
              gamesLost: 0,
              currentStreak: 0,
              bestStreak: 0
            };
            
            stats.gamesPlayed = (stats.gamesPlayed || 0) + 1;
            
            if (isWinner) {
              stats.gamesWon = (stats.gamesWon || 0) + 1;
              stats.currentStreak = (stats.currentStreak || 0) + 1;
              if (stats.currentStreak > (stats.bestStreak || 0)) {
                stats.bestStreak = stats.currentStreak;
              }
            } else {
              stats.gamesLost = (stats.gamesLost || 0) + 1;
              stats.currentStreak = 0;
            }
            
            return stats;
          }).then(() => {
            console.log(`Stats updated for ${player.username}`);
          }).catch(err => {
            console.error(`Error updating stats for ${player.username}:`, err);
          });
        }
      });
    }
  }, [phase, gameState?.winner, players]);

  // Auto-select non-trump cards during discard phase
  useEffect(() => {
    if (phase === 'discarding' && currentPlayer === mySeatIndex && trumpSuit) {
      const myHand = hands[mySeatIndex] || [];
      const nonTrumpIndices = [];
      myHand.forEach((card, idx) => {
        // Use isTrump function which handles A♥ correctly
        if (!isTrump(card, trumpSuit)) {
          nonTrumpIndices.push(idx);
        }
      });
      if (nonTrumpIndices.length > 0) {
        setSelected(nonTrumpIndices);
      }
    }
  }, [phase, currentPlayer, mySeatIndex, trumpSuit, hands]);

  // Sync local state with Firebase gameState
  useEffect(() => {
    if (gameState) {
      console.log('Syncing game state from Firebase:', gameState);
      
      if (gameState.phase) setPhase(gameState.phase);
      if (gameState.dealer !== undefined) setDealer(gameState.dealer);
      if (gameState.currentPlayer !== undefined) setCurrentPlayer(gameState.currentPlayer);
      if (gameState.scores) setScores(gameState.scores);
      if (gameState.bids) setBids(gameState.bids);
      if (gameState.highBid !== undefined) setHighBid(gameState.highBid);
      if (gameState.bidWinner !== undefined) setBidWinner(gameState.bidWinner);
      if (gameState.trumpSuit) setTrumpSuit(gameState.trumpSuit);
      if (gameState.wasBagged !== undefined) setWasBagged(gameState.wasBagged);
      
      // CRITICAL: Sync hands! Firebase quirk: arrays can become objects
      if (gameState.hands) {
        // Normalize: Firebase converts arrays to objects with numeric keys
        const rawHands = gameState.hands;
        let normalizedHands;
        
        if (Array.isArray(rawHands)) {
          // Already an array - normalize each hand
          normalizedHands = rawHands.map(hand => 
            Array.isArray(hand) ? hand : (hand ? Object.values(hand).filter(c => c) : [])
          );
        } else {
          // Object with numeric keys - convert to array
          normalizedHands = normalizeArray(rawHands, 4, []).map(hand =>
            Array.isArray(hand) ? hand : (hand ? Object.values(hand).filter(c => c) : [])
          );
        }
        
        console.log('📊 Syncing hands - Raw:', rawHands, '→ Normalized:', normalizedHands);
        setHands(normalizedHands);
      }
      
      // Sync bids and normalize to ensure 4 elements
      if (gameState.bids !== undefined) {
        const normalizedBids = normalizeArray(gameState.bids, 4, null);
        console.log('📊 Syncing bids - Raw:', gameState.bids, 'Normalized:', normalizedBids, 'My bid:', normalizedBids[mySeatIndex]);
        setBids(normalizedBids);
      }
      
      // Sync other state
      if (gameState.kitty) setKitty(gameState.kitty);
      if (gameState.deck) setDeck(gameState.deck);

              left: '50%',
              transform: 'translate(-50%, -50%)',
              background: 'rgba(0,0,0,0.95)',
              padding: '48px',
              borderRadius: '16px',
              border: `4px solid ${isWin ? '#4caf50' : '#f44336'}`,
              zIndex: 100,
              minWidth: '500px',
              textAlign: 'center'
            }}>
              <div style={{ fontSize: '48px', marginBottom: '24px', color: isWin ? '#4caf50' : '#f44336', fontWeight: 'bold' }}>
                {isWin ? '🏆 VICTORY!' : '💀 DEFEAT'}
              </div>
              
              <div style={{ fontSize: '24px', marginBottom: '32px' }}>
                <div style={{ marginBottom: '12px' }}>
                  <span style={{ color: isWin ? '#4caf50' : '#aaa' }}>Us: </span>
                  <span style={{ fontWeight: 'bold', color: isWin ? '#4caf50' : '#aaa' }}>
                    {scores[myTeam]}
                  </span>
                </div>
                <div>
                  <span style={{ color: isWin ? '#aaa' : '#f44336' }}>Them: </span>
                  <span style={{ fontWeight: 'bold', color: isWin ? '#aaa' : '#f44336' }}>
                    {scores[1 - myTeam]}
                  </span>
                </div>
              </div>

              <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', flexWrap: 'wrap' }}>
                <button
                  onClick={() => setShowHandsOpen(true)}
                  style={{
                    padding: '12px 24px',
                    fontSize: '16px',
                    background: '#2196f3',
                    color: 'white',
                    border: 'none',
                    borderRadius: '8px',
                    cursor: 'pointer'
                  }}
                >
                  View Round
                </button>
                <button
                  onClick={onLeaveGame}
                  style={{
                    padding: '12px 24px',
                    fontSize: '16px',
                    background: '#666',
                    color: 'white',
                    border: 'none',
                    borderRadius: '8px',
                    cursor: 'pointer'
                  }}
                >
                  Lobby
                </button>
                <button
                  onClick={handleRematch}
                  style={{
                    padding: '12px 24px',
                    fontSize: '16px',
                    background: '#d4af37',
                    color: '#000',
                    border: 'none',
                    borderRadius: '8px',
                    cursor: 'pointer',
                    fontWeight: 'bold'
                  }}
                >
                  New Game
                </button>
              </div>
            </div>
          );
        })()}
      </div>

      {/* Score Table at Bottom */}
      <div style={{
        padding: '8px 16px',
        background: 'rgba(0,0,0,0.4)',
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center',
        gap: '4px'
      }}>
        {/* Last Trick */}
        <div style={{ height: '44px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          {lastTrick && phase === 'playing' && (
            <div style={{ display: 'flex', alignItems: 'center', gap: '2px', padding: '2px', background: 'rgba(0,0,0,0.2)', borderRadius: '4px' }}>
              <span style={{ fontSize: '9px', color: '#aaa' }}>Last:</span>
              {lastTrick.cards.map((tc, i) => {
                const isWinner = tc.player === lastTrick.winner;
                return (
                  <div key={i} style={{ position: 'relative' }}>
                    <Card card={tc.card} small disabled />
                    {isWinner && (
                      <div style={{
                        position: 'absolute',
                        top: '-6px',
                        right: '-6px',
                        background: '#4caf50',
                        borderRadius: '50%',
                        width: '12px',
                        height: '12px',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        fontSize: '8px'
                      }}>
                        ✓
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
        
        {/* Score table */}
        <ScoreTable roundHistory={history} mySeatIndex={mySeatIndex} />
      </div>

      {/* Modals */}
      <ShowHandsModal 
        isOpen={showHandsOpen}
        onClose={() => setShowHandsOpen(false)}
        hands={postDrawHands || hands}
        dealer={dealer}
        bidWinner={bidWinner}
        highBid={highBid}
        trumpSuit={trumpSuit}
        drawn={drawn}
        drawnCards={drawnCards}
        wasBagged={wasBagged}
        playHistory={playHistory}
        bids={bids}
        mySeatIndex={mySeatIndex}
        players={players}
        scores={scores}
      />
      <HelpModal isOpen={helpOpen} onClose={() => setHelpOpen(false)} />
    </div>
  );

}

ReactDOM.createRoot(document.getElementById('root')).render(<MultiplayerApp />);
  </script>
</body>
</html>
