  const [drawnCards, setDrawnCards] = useState(new Set());
  const [drawAnimCards, setDrawAnimCards] = useState(new Set());
  const [drawAnimOpponents, setDrawAnimOpponents] = useState({});
  const prevDrawnCardsRef = useRef(new Set());
  const prevDrawnCountsRef = useRef([0,0,0,0]);
  const [kittyCardIds, setKittyCardIds] = useState(new Set());
  const [animating, setAnimating] = useState(null);
  const [dealAnimActive, setDealAnimActive] = useState(false);
  const [kittyOnTable, setKittyOnTable] = useState(false);
  const [confirmLeave, setConfirmLeave] = useState(false);
  const [kittyFlying, setKittyFlying] = useState(null); // 'top'|'bottom'|'left'|'right'
  const prevPhaseForDealRef = useRef(null);
  const [wasBagged, setWasBagged] = useState(false);
  const [helpOpen, setHelpOpen] = useState(false);
  const [soundMuted, setSoundMuted] = useState(SoundManager.isMuted());
  const [voiceActive, setVoiceActive] = useState(VoiceChat.active);
  const [voiceMuted, setVoiceMuted] = useState(VoiceChat.muted);
  const [voiceUsers, setVoiceUsers] = useState({});    // uid → { enabled, muted }
  const [speakingUids, setSpeakingUids] = useState({}); // uid → true when speaking
  const [knownOutOfTrump, setKnownOutOfTrump] = useState([false, false, false, false]);
  const [knownVoids, setKnownVoids] = useState([{},{},{},{}]);
  // knownVoids[player] = { '♠': true, '♦': true, trump: true|'reneging', possibleTrump: ['J♠','A♥'], noLowTrump: true }
  const [bidderLostTrick, setBidderLostTrick] = useState(false);
  const [postDrawHands, setPostDrawHands] = useState(null);
  const [showHandsOpen, setShowHandsOpen] = useState(false);
  const [roundDealer, setRoundDealer] = useState(0);
  const [roundDrawn, setRoundDrawn] = useState([0, 0, 0, 0]);
  const [cardsPlayed, setCardsPlayed] = useState([]);
  const [playHistory, setPlayHistory] = useState([]);
  const [roundBids, setRoundBids] = useState([-1, -1, -1, -1]);
  const timer = useRef(null);
  const dealtHands = useRef(null);
  const statsUpdated = useRef(false); // Track if stats were updated for this game

  // 5-Card Draw: face-up card revealed when player swaps all 5
  const [faceUpCard, setFaceUpCard] = useState(null); // { playerId, cardId }

  // 30 for 60 option
  const [thirtyWasBid, setThirtyWasBid] = useState(false); // someone bid 30 this round
  const [bidType, setBidType] = useState(null); // '30for60' or null

  // Follow suit toast
  const [followSuitToast, setFollowSuitToast] = useState(false);

  // House Rules overlay — shown once at game start if any options are active
  const [showHouseRules, setShowHouseRules] = useState(false);
  const houseRulesShown = useRef(false);

  // Per-game achievement tracking (reset each new game)
  const [gameTimesSet, setGameTimesSet] = useState(0);
  const [gamePerfect30s, setGamePerfect30s] = useState(0);
  const [gameBid30Made, setGameBid30Made] = useState(0);
  const [gameExceedBidPts, setGameExceedBidPts] = useState(0);
  const wasSetThisGame = useRef(false); // for cleanGameWins check

  // Extended per-game badge tracking
  const [gameConsec30s, setGameConsec30s] = useState(0);          // current consecutive perfect-30 rounds
  const [gameMaxConsec30s, setGameMaxConsec30s] = useState(0);    // max consecutive 30s this game
  const [gameRoundWins, setGameRoundWins] = useState(0);          // current streak of rounds where we scored > they did
  const [gameMaxRoundWins, setGameMaxRoundWins] = useState(0);    // max round-win streak this game
  const [gameOppSets, setGameOppSets] = useState(0);              // times opponent was set this game
  const [gameFiveCardDrawUsed, setGameFiveCardDrawUsed] = useState(false);
  const [gameWasBagged, setGameWasBagged] = useState(false);
  const [newlyEarnedBadges, setNewlyEarnedBadges] = useState([]);
  const [expandedBadge, setExpandedBadge] = useState(null);
  const [gameScoreWentNegative, setGameScoreWentNegative] = useState(false);

  // Reset all per-game tracking when gameId changes
  useEffect(() => {
    statsUpdated.current = false;
    wasSetThisGame.current = false;
    setGameTimesSet(0);
    setGamePerfect30s(0);
    setGameBid30Made(0);
    setGameExceedBidPts(0);
    setGameConsec30s(0);
    setGameMaxConsec30s(0);
    setGameRoundWins(0);
    setGameMaxRoundWins(0);
    setGameOppSets(0);
    setGameFiveCardDrawUsed(false);
    setGameWasBagged(false);
    setNewlyEarnedBadges([]);
    setGameScoreWentNegative(false);
    console.log('Game ID changed - reset statsUpdated flag');
  }, [gameId]);

  const autoStartFired = useRef(false);

  // Update player stats when game ends
  useEffect(() => {
    if (phase === 'game-over' && gameState?.winner !== undefined && !statsUpdated.current) {
      statsUpdated.current = true;
      const winningTeam = gameState.winner;
      const finalScores = gameState.scores || [0, 0];
      const hist = gameState.history || [];
      const roundsPlayed = hist.length;

      console.log('Updating player stats - Winner: Team', winningTeam);

      // Update stats for all human players
      Object.entries(players).forEach(([seat, player]) => {
        if (player && !player.isAI && player.userId) {
          const seatIndex = SEAT_TO_INDEX[seat];
          const playerTeam = seatIndex % 2;
          const isWinner = playerTeam === winningTeam;
          const isMe = player.userId === userId;

          console.log(`Updating stats for ${player.username} - ${isWinner ? 'WON' : 'LOST'}`);

          const myFinalScore = finalScores[playerTeam] || 0;
          const oppFinalScore = finalScores[1 - playerTeam] || 0;
          const bothTeams120 = myFinalScore >= 120 && oppFinalScore >= 120;

          const statsRef = database.ref(`users/${player.userId}/stats`);
          // Capture pre-game badge eligibility inside the transaction callback
          // so we only notify about badges earned THIS game (not pre-existing qualifiers)
          let preBadgeIds = new Set();
          statsRef.transaction((currentStats) => {
            if (currentStats) preBadgeIds = new Set(getBadgeIds(currentStats));
            const stats = currentStats || {
              gamesPlayed: 0, gamesWon: 0, gamesLost: 0, currentStreak: 0, bestStreak: 0
            };

            stats.gamesPlayed = (stats.gamesPlayed || 0) + 1;
            stats.lastSeen = Date.now();

            if (isWinner) {
              stats.gamesWon = (stats.gamesWon || 0) + 1;
              stats.currentStreak = (stats.currentStreak || 0) + 1;
              if (stats.currentStreak > (stats.bestStreak || 0)) {
                stats.bestStreak = stats.currentStreak;
              }

              // Comeback win
              const wasComeback = hist.some(h => {
                const ourTotal = playerTeam === 0 ? h.usTotal : h.themTotal;
                const oppTotal = playerTeam === 0 ? h.themTotal : h.usTotal;
                return ourTotal <= 55 && oppTotal >= 90;
              });
              if (wasComeback) stats.comebackWins = (stats.comebackWins || 0) + 1;

              // Clean game win (no set this game — only tracked for isMe)
              if (isMe && !wasSetThisGame.current) {
                stats.cleanGameWins = (stats.cleanGameWins || 0) + 1;
              }

              // Speed wins
              if (isMe) {
                if (roundsPlayed <= 4) stats.fastWins4 = (stats.fastWins4 || 0) + 1;
                else if (roundsPlayed === 5) stats.fastWins5 = (stats.fastWins5 || 0) + 1;
                else if (roundsPlayed === 6) stats.fastWins6 = (stats.fastWins6 || 0) + 1;

                if (gameScoreWentNegative) stats.winFromNegative = (stats.winFromNegative || 0) + 1;
                if (oppFinalScore <= 0) stats.shutoutWins = (stats.shutoutWins || 0) + 1;
                if (gameWasBagged) stats.baggedGameWon = (stats.baggedGameWon || 0) + 1;
                if (gameTimesSet >= 3) stats.winAfterSet3 = (stats.winAfterSet3 || 0) + 1;
                if (gameMaxConsec30s >= 3) stats.hatTrick = (stats.hatTrick || 0) + 1;
                if (gameMaxRoundWins >= 4) stats.dominant = (stats.dominant || 0) + 1;
                if (gameFiveCardDrawUsed) stats.wonAfter5Draw = (stats.wonAfter5Draw || 0) + 1;
                if (myFinalScore === 120) stats.centurionGames = (stats.centurionGames || 0) + 1;
                if (bothTeams120) stats.photoFinishGames = (stats.photoFinishGames || 0) + 1;
                // Card Shark: consecutive wins without being set
                if (!wasSetThisGame.current) {
                  stats.cardSharkStreak = (stats.cardSharkStreak || 0) + 1;
                } else {
                  stats.cardSharkStreak = 0;
                }
              }
            } else {
              stats.gamesLost = (stats.gamesLost || 0) + 1;
              stats.currentStreak = 0;
              if (isMe) {
                stats.cardSharkStreak = 0; // reset on loss
                if (bothTeams120) stats.heartbreakerGames = (stats.heartbreakerGames || 0) + 1;
              }
            }

            return stats;
          }).then(result => {
            console.log(`Stats updated for ${player.username}`);
            // Badge award — only isMe handles their own badges
            if (!isMe) return;
            const updatedStats = result.snapshot.val();
            if (!updatedStats) return;

            const postBadgeIds = getBadgeIds(updatedStats);
            // Badges truly earned this game = qualified after but not before
            const thisGameBadges = postBadgeIds.filter(id => !preBadgeIds.has(id));

            // Also silently bootstrap any pre-existing qualifiers not yet in Firebase
            database.ref(`users/${userId}/badges`).once('value').then(badgeSnap => {
              const existingBadges = badgeSnap.val() || {};
              // Write all qualifying badges not yet recorded (bootstrap + this-game)
              const toWrite = postBadgeIds.filter(id => !existingBadges[id]);
              if (toWrite.length === 0) return;

              const badgeUpdates = {};
              toWrite.forEach(id => {
                badgeUpdates[`users/${userId}/badges/${id}`] = { earnedAt: Date.now() };
              });
              // Compute total badge score from all qualifying badges and cache in stats
              const totalBadgeScore = postBadgeIds.reduce((sum, id) => sum + (BADGES.find(b => b.id === id)?.pts || 0), 0);
              return database.ref().update(badgeUpdates).then(() => {
                console.log(`🏅 Wrote ${toWrite.length} badges to Firebase (${thisGameBadges.length} new this game)`);
                return database.ref(`users/${userId}/stats/badgeScore`).set(totalBadgeScore);
              }).then(() => {
                // Only notify + display badges earned in THIS game
                if (thisGameBadges.length === 0) return;
                const earned = thisGameBadges.map(id => BADGES.find(b => b.id === id)).filter(Boolean);
                setNewlyEarnedBadges(earned);
                console.log('🏅 New badges earned this game:', earned.map(b => b.name).join(', '));
              });
            }).catch(err => console.error('Badge award error:', err));
          }).catch(err => {
            console.error(`Error updating stats for ${player.username}:`, err);
          });
        }
      });
    }
  }, [phase, gameState?.winner, players, userId]);

  // Auto-select non-trump cards during discard phase
  useEffect(() => {
    if (phase === 'discarding' && currentPlayer === mySeatIndex && trumpSuit) {
      const myHand = hands[mySeatIndex] || [];
      const nonTrumpIndices = [];

    // Firebase SDK can return arrays with undefined holes from sparse data
    if (Array.isArray(arr) && arr.length === expectedLength) {

    }

    // Firebase may return object with numeric keys
    const normalized = new Array(expectedLength).fill(defaultValue);
    if (typeof arr === 'object') {
      Object.keys(arr).forEach(key => {
        const index = parseInt(key);
        if (!isNaN(index) && index < expectedLength) {

            if (!playedIsTrump) {
              // Player played offsuit on trump lead - check renege possibilities
              const possibleHoldings = [];
              if (!allPlayedIds.has(`5${trumpSuit}`) && ledRank < 102) possibleHoldings.push(`5${trumpSuit}`);
              if (!allPlayedIds.has(`J${trumpSuit}`) && ledRank < 101) possibleHoldings.push(`J${trumpSuit}`);
              if (!allPlayedIds.has('A\u2665') && ledRank < 100) possibleHoldings.push('A\u2665');

              if (possibleHoldings.length === 0) {
                newKnownVoids[tc.player].trump = true;
                newKnownOutOfTrump[tc.player] = true;
                console.log(`\uD83E\uDDE0 INTEL: P${tc.player + 1} is COMPLETELY void in trump`);
              } else {
                newKnownVoids[tc.player].trump = 'reneging';
                newKnownVoids[tc.player].possibleTrump = possibleHoldings;
                newKnownVoids[tc.player].noLowTrump = true;
                newKnownOutOfTrump[tc.player] = true;
                console.log(`\uD83E\uDDE0 INTEL: P${tc.player + 1} played offsuit on trump lead - may hold: ${possibleHoldings.join(', ')}`);
              }
            }
          });
        } else {
          // Offsuit was led - check who didn't follow suit
          const ledSuit = ledCard.suit;
          newTrickCards.forEach((tc) => {
            if (tc.player === trickLeader) return;
            const playedIsTrump = getTrumpRank(tc.card, trumpSuit) >= 0;
            const followedSuit = !playedIsTrump && tc.card.suit === ledSuit;
            if (playedIsTrump) {
              // Played trump on offsuit lead - can't determine if void in led suit
            } else if (!followedSuit) {
              // Played a DIFFERENT offsuit - void in led suit AND trump
              newKnownVoids[tc.player][ledSuit] = true;
              newKnownVoids[tc.player].trump = true;
              newKnownOutOfTrump[tc.player] = true;
              console.log(`\uD83E\uDDE0 INTEL: P${tc.player + 1} is void in ${ledSuit} AND trump (played different offsuit)`);
            }
          });
        }
        setKnownOutOfTrump(newKnownOutOfTrump);
        setKnownVoids(newKnownVoids);

        // Track if bidder lost a trick
        if (bidWinner >= 0 && !bidderLostTrick) {
          const bidderTeam = getTeam(bidWinner);
          if (winnerTeam !== bidderTeam) {

            console.log(`\uD83E\uDDE0 INTEL: Bidder (P${bidWinner + 1}) lost first trick`);
          }
        }

        // Save trick for "Last Trick" display
        setLastTrick({ cards: newTrickCards, winner });

        // Animate cards to winner (reduced from 600ms for faster play)
        setAnimating(winner);
        await new Promise(resolve => setTimeout(resolve, 400));
        setAnimating(null);
        
        // Track highest trump played
        let highTrumpRank = -1;
        let highTrumpPlayer = -1;
        for (let i = 0; i < newTrickCards.length; i++) {
          const tc = newTrickCards[i];
          const trumpRank = getTrumpRank(tc.card, trumpSuit);
          if (trumpRank > highTrumpRank) {
            highTrumpRank = trumpRank;
            highTrumpPlayer = tc.player;
          }
        }
        
        // Update high trump info if this trick has higher trump
        let newHighTrumpInfo = highTrumpInfo;
        if (highTrumpRank > highTrumpInfo.rank) {
          newHighTrumpInfo = { rank: highTrumpRank, player: highTrumpPlayer };
          setHighTrumpInfo(newHighTrumpInfo);
          console.log(`🎯 AI: New high trump: rank ${highTrumpRank} by P${highTrumpPlayer + 1}`);
        }
        
        console.log(`🏆 Trick ${trickNum} won by P${winner + 1}`);
        
        const newTricksWon = [...tricksWon];
        newTricksWon[winnerTeam]++;
        
        const newPlayerTricks = [...playerTricks];
        newPlayerTricks[winner]++;
        
        const newRoundPts = [...roundPts];
        newRoundPts[winnerTeam] += 5;
        
        if (trickNum + 1 >= 5) {
          console.log('🎮 AI: Round complete!');
          
          // Add high trick bonus (5 points)
          const finalRoundPts = [...newRoundPts];
          if (newHighTrumpInfo.rank >= 0) {
            const highTrickTeam = getTeam(newHighTrumpInfo.player);
            finalRoundPts[highTrickTeam] += 5;
            console.log(`🎯 AI: High trick bonus: +5 points to Team ${highTrickTeam}`);
          }
          
          const bidderTeam = bidWinner % 2;
          const newScores = [...scores];
          
          if (finalRoundPts[bidderTeam] >= highBid) {
            newScores[bidderTeam] += finalRoundPts[bidderTeam];
          } else {
            newScores[bidderTeam] -= highBid;
          }
          newScores[1 - bidderTeam] += finalRoundPts[1 - bidderTeam];
          
          // Update history for score table
          let usRoundScore, themRoundScore;
          if (bidderTeam === 0) {
            usRoundScore = finalRoundPts[0] >= highBid ? finalRoundPts[0] : -highBid;
            themRoundScore = finalRoundPts[1];
          } else {
            usRoundScore = finalRoundPts[0];
            themRoundScore = finalRoundPts[1] >= highBid ? finalRoundPts[1] : -highBid;
          }
          
          // Build new history array (will sync to Firebase, then to local state)
          const newHistory = [...history, {
            usRoundScore,
            themRoundScore,
            usTotal: newScores[0],
            themTotal: newScores[1]
          }];
          
          // Check for game winner (first to 120, bidding team wins ties)
          let gameWinner = null;
          const team0Reached120 = newScores[0] >= 120;
          const team1Reached120 = newScores[1] >= 120;
          if (team0Reached120 || team1Reached120) {
            if (team0Reached120 && team1Reached120) {
              // Both teams reached 120 on same hand - bidding team wins
              gameWinner = bidWinner % 2;
              console.log('Both teams reached 120! Bidding team (Team ' + gameWinner + ') wins!');
            } else {
              gameWinner = team0Reached120 ? 0 : 1;
            }

          if (gameWinner !== null) {

              hands: cleanHands(newHands),

              trick: [],
              tricksWon: newTricksWon,
              playerTricks: newPlayerTricks,

              roundBids: bids,            // ✅ Already here
              roundDrawn: drawn,          // ✅ Already here
              roundDealer: dealer         // ✅ Already here
            });
          }
        } else {

        console.log('🔄 Resetting trickComplete flag for new trick');
        setTrickComplete(false);

        });

    })(); // Close async IIFE - executes immediately
    
  }, [resettingRound, phase, currentPlayer, mySeatIndex, players, hands, trickCards, trumpSuit, trickLeader, trickNum, tricksWon, playerTricks, roundPts, updateGameState, trickComplete]);

  // Main game view - Circular table layout

  };

  // Deal sequence: 3 to each player in order, 3 kitty, 2 to each in order

  const DEAL_STAGGER = 150;
  const KITTY_START = 12 * DEAL_STAGGER; // after 12 first-round cards

  const getDealDelay = (seatIndex, cardIndex) => {

  const dealAnimStyle = (seatIndex, cardIndex) => {

                    {trickCards && trickCards.length > 0 && trickCards.map((tc, idx) => {
                      if (!tc || !tc.card) return null;

                      let dirClass;
                      if (tc.player === visualPositions.bottom) dirClass = 'south';
                      else if (tc.player === visualPositions.top) dirClass = 'north';
                      else if (tc.player === visualPositions.left) dirClass = 'west';
                      else if (tc.player === visualPositions.right) dirClass = 'east';

                      // Winner fly animation

                      let winnerVisualPos;
                      if (animating === visualPositions.bottom) winnerVisualPos = 'south';
                      else if (animating === visualPositions.top) winnerVisualPos = 'north';
                      else if (animating === visualPositions.left) winnerVisualPos = 'west';
                      else if (animating === visualPositions.right) winnerVisualPos = 'east';
                      const isAnimating = animating !== null;
                      const winPos = isAnimating ? winnerPositions[winnerVisualPos] : { x: 0, y: 0 };

                        <div

                          className={`v3-trick-card${dirClass ? ' ' + dirClass : ''}`}

                            transition: isAnimating ? 'all 0.4s ease' : 'none',
                            transform: isAnimating ? `translate(${winPos.x}px, ${winPos.y}px) scale(0.2)` : undefined,

      {/* Score Table + Last Trick strip at Bottom */}
      <div style={{
        padding: (history.length > 0 || (phase === 'playing' && currentThemeId === 'irish')) ? '6px 16px 0' : '0',
        background: history.length > 0 ? 'rgba(0,0,0,0.4)' : 'transparent',
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center',
        gap: '4px'
      }}>
        {/* Irish last trick strip — always reserved during playing to prevent layout shift */}
        {phase === 'playing' && currentThemeId === 'irish' && (
          <div style={{
            width: '100%',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            gap: '4px',
            padding: '3px 6px',
            background: lastTrick ? 'rgba(10,30,15,0.82)' : 'transparent',
            WebkitBackdropFilter: lastTrick ? 'blur(4px)' : 'none',
            backdropFilter: lastTrick ? 'blur(4px)' : 'none',
            border: lastTrick ? '1px solid rgba(201,162,74,0.35)' : '1px solid transparent',
            borderRadius: '6px',
            whiteSpace: 'nowrap',
            visibility: lastTrick ? 'visible' : 'hidden',
            minHeight: '42px',
          }}>
            <span style={{ fontSize: '9px', color: 'rgba(201,162,74,0.7)', fontFamily: "'Cinzel', serif", letterSpacing: '0.5px', marginRight: '2px' }}>Last</span>
            {lastTrick && lastTrick.cards.map((tc, i) => {
              const isWinner = tc.player === lastTrick.winner;
              return (
                <div key={i} className="ir-trick-strip" style={{ position: 'relative' }}>
                  <Card card={tc.card} mid disabled />
                  {isWinner && (
                    <div style={{
                      position: 'absolute', top: '-5px', right: '-5px',
                      background: '#5dd084', borderRadius: '50%',
                      width: '11px', height: '11px',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      fontSize: '7px', color: '#0a1a0a', fontWeight: 'bold',
                    }}>✓</div>
                  )}
                </div>
              );
            })}
          </div>
        )}
        {/* Score table */}
        <ScoreTable roundHistory={history} mySeatIndex={mySeatIndex} />
      </div>

      {/* Modals */}
      <ShowHandsModal 
        isOpen={showHandsOpen}
        onClose={() => setShowHandsOpen(false)}
        hands={postDrawHands || hands}
        dealer={dealer}
        bidWinner={bidWinner}
        highBid={highBid}
        trumpSuit={trumpSuit}
        drawn={drawn}
        drawnCards={drawnCards}
        kittyCardIds={kittyCardIds}
        wasBagged={wasBagged}
        playHistory={playHistory}
        bids={bids}
        mySeatIndex={mySeatIndex}
        players={players}
        scores={scores}
        faceUpCard={faceUpCard}
      />
      <HelpModal isOpen={helpOpen} onClose={() => setHelpOpen(false)} />

      {/* Themed leave-game confirm */}
      {confirmLeave && (currentThemeId === 'cyberpunk' ? (
        <div className="cp-modal-overlay" style={{ zIndex: 9000 }}>
          <div className="cp-modal" style={{ maxWidth: '300px', width: '88%', textAlign: 'center' }}>
            <div className="cp-modal-title" style={{ marginBottom: '8px' }}>Leave Game?</div>
            <div className="cp-modal-hairline" />
            <div className="cp-modal-body">
              <div className="cp-confirm-msg">You'll return to the lobby. Your seat will be taken by AI.</div>
              <div style={{ display: 'flex', gap: '10px', marginTop: '16px' }}>
                <button onClick={() => setConfirmLeave(false)} className="cp-modal-btn-ghost" style={{ flex: 1 }}>Stay</button>
                <button onClick={() => { setConfirmLeave(false); onLeaveGame(); }} className="cp-modal-btn-primary" style={{ flex: 1, background: 'linear-gradient(135deg, #c9341a, #8b1f0e)', borderColor: 'rgba(201,52,26,0.7)', boxShadow: '0 0 12px rgba(201,52,26,0.4)' }}>Leave</button>
              </div>
            </div>
          </div>
        </div>
      ) : (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.75)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 9000, animation: 'fadeIn 0.15s ease-out' }}>
          <div style={{ background: 'rgba(12,6,2,0.97)', border: '2px solid #c9a24a', borderRadius: '14px', padding: '28px 24px', maxWidth: '300px', width: '88%', boxShadow: '0 8px 40px rgba(0,0,0,0.8)', textAlign: 'center' }}>
            <div style={{ fontFamily: "'Cinzel', serif", fontSize: '17px', fontWeight: 700, color: '#f6d778', marginBottom: '10px', letterSpacing: '0.5px' }}>Leave Game?</div>
            <div style={{ fontFamily: "'Merriweather', serif", fontStyle: 'italic', fontSize: '13px', color: 'rgba(232,228,217,0.7)', marginBottom: '24px', lineHeight: 1.5 }}>You'll return to the lobby. Your seat will be taken by AI.</div>
            <div style={{ display: 'flex', gap: '10px' }}>
              <button onClick={() => setConfirmLeave(false)} style={{ flex: 1, padding: '11px', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(201,162,74,0.3)', borderRadius: '8px', color: 'rgba(232,228,217,0.7)', fontFamily: "'Cinzel', serif", fontSize: '13px', fontWeight: 700, cursor: 'pointer' }}>Stay</button>
              <button onClick={() => { setConfirmLeave(false); onLeaveGame(); }} style={{ flex: 1, padding: '11px', background: 'linear-gradient(180deg, #c9341a 0%, #8b1f0e 100%)', border: '1px solid rgba(0,0,0,0.4)', borderRadius: '8px', color: '#fff', fontFamily: "'Cinzel', serif", fontSize: '13px', fontWeight: 700, cursor: 'pointer', boxShadow: '0 2px 0 rgba(0,0,0,0.4)' }}>Leave</button>
            </div>
          </div>
        </div>
      ))}
    </div>
  );

}

ReactDOM.createRoot(document.getElementById('root')).render(<MultiplayerApp />);
  </script>
</body>
</html>
